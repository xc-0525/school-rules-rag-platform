server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30m;

    # 小带宽机器（3M）必开：主包 1.1MB → 约 350KB，首屏从 ~5s 降到 ~1.5s
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    # Let's Encrypt 证书校验（acme.sh webroot 模式）
    # 目录不存在只影响证书续期，不影响正常访问；启用 HTTPS 后由 nginx.https.conf 接替
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SPA 路由：/chat、/history、/documents 都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 流式问答：必须关闭代理缓冲，否则前端会“一次性”显示或卡住
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # P1-3：不再代理交互式文档（/docs /openapi.json /redoc）——生产档位后端也已关闭；
    # 需要查看接口清单时由管理员从服务器内网访问后端 8000 端口。

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
