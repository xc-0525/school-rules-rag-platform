# HTTPS 版 nginx 配置（由 docker-compose.https.yml 挂载覆盖 default.conf）
#
# 使用前提：
#   1. 证书已放到宿主机 ./certs/（fullchain.pem + privkey.pem）
#   2. 下面的 server_name 换成你自己的域名
#   3. 用 -f docker-compose.yml -f docker-compose.https.yml 启动
#
# 之所以单独一个文件而不是改 nginx.conf：证书文件不存在时 nginx 会直接启动失败，
# 本地开发/无域名演示时仍然要能用纯 80 端口跑，两者不能混在同一个 server 块里。

# ---------- 80：只留 ACME 校验 + 跳转 HTTPS ----------
server {
    listen 80;
    server_name rules.example.com;   # ← 换成你的域名

    # certbot webroot 校验路径。续期时不需要停容器，也不需要占 80 端口做 standalone
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：正式站点 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name rules.example.com;   # ← 换成你的域名

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 确认 HTTPS 稳定跑通一周后再放开，开了浏览器会记住一年，回退很麻烦
    # add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30m;

    # 小带宽机器（3M）必开：主包 1.1MB → 约 350KB，首屏从 ~5s 降到 ~1.5s
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    # SPA 路由：/chat、/history、/documents 都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 流式问答：必须关闭代理缓冲，否则前端会“一次性”显示或卡住
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # P1-3：不再代理交互式文档（/docs /openapi.json /redoc）——生产档位后端也已关闭；
    # 需要查看接口清单时由管理员从服务器内网访问后端 8000 端口。

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
