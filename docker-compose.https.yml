# HTTPS 覆盖层：给 frontend 加 443 端口 + 挂证书
#
# 用法（三个 -f 一起）：
#   docker compose -f docker-compose.yml -f docker-compose.4g.yml -f docker-compose.https.yml up -d
#
# 前置条件（缺一个都起不来）：
#   1. 域名 A 记录已指向服务器公网 IP
#   2. ./certs/fullchain.pem 与 ./certs/privkey.pem 已就位
#   3. ./frontend/nginx.https.conf 里的 server_name 已改成真实域名
#   4. .env 里 HTTP_PORT=80（不设的话宿主机只映射 8080，80 跳转用不上）

services:
  frontend:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # 覆盖镜像里 COPY 进去的 default.conf
      - ./frontend/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书只读挂载
      - ./certs:/etc/nginx/certs:ro
      # certbot webroot 已在 docker-compose.yml 里挂载（./certbot/www → /var/www/certbot），此处不重复
